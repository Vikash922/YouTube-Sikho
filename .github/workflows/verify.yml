name: Master Quality & Security Verification

on:
  push:
    branches: [ main, upgrade/expo-sdk-58 ]
  pull_request:
    branches: [ main, upgrade/expo-sdk-58 ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Quality Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java 21 for Firebase Emulators
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📦 Install Root Dependencies
        run: npm ci

      - name: 📦 Install Admin Dependencies
        run: npm --prefix admin ci

      - name: 📦 Install Functions Dependencies
        run: npm --prefix functions ci

      - name: 🛡️ Pre-Commit Secret Scan
        run: npm run lint:secrets

      - name: 🔍 Dual-Language i18n Key Parity
        run: npm run lint:i18n

      - name: 🎨 WCAG Color Contrast & Theme Tokens
        run: |
          npm run lint:tokens
          npm run lint:contrast

      - name: 🩺 Expo Doctor Check
        run: npm run doctor

      - name: 🏗️ Execute Master Quality Pipeline (Root, Admin, Functions)
        run: npm run verify
